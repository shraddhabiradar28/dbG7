<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>ReconX (static) — Trades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="layout__header" role="banner">
    <h1 class="layout__title">ReconX</h1>
    <nav class="layout__nav" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="trades.html" aria-current="page">Trades</a>
      <a href="recon.html">Recon</a>
    </nav>
    <button id="theme-toggle" aria-label="Toggle light/dark theme">🌗</button>
  </header>

  <aside class="layout__sidebar" role="complementary">
    <h2>Trade controls</h2>
    <ul>
      <li><a href="#">View latest</a></li>
      <li><a href="#">Sort by notional</a></li>
      <li><a href="#">Resize columns</a></li>
    </ul>
  </aside>

  <main class="layout__main" role="main">
    <section aria-labelledby="trades-title">
      <h2 id="trades-title">Trades</h2>
      <div class="table-scroll">
        <table class="data-table" id="trades-table">
          <thead>
            <tr>
              <th data-col="tradeRef" data-dir="asc" aria-sort="none">
                <span class="resize-handle" aria-hidden="true"></span>
                Trade Ref
              </th>
              <th data-col="symbol" data-dir="asc" aria-sort="none">
                <span class="resize-handle" aria-hidden="true"></span>
                Symbol
              </th>
              <th data-col="qty" data-dir="asc" data-type="number" aria-sort="none">
                <span class="resize-handle" aria-hidden="true"></span>
                Qty
              </th>
              <th data-col="price" data-dir="asc" data-type="number" aria-sort="none">
                <span class="resize-handle" aria-hidden="true"></span>
                Price
              </th>
              <th data-col="status" data-dir="asc" aria-sort="none">
                <span class="resize-handle" aria-hidden="true"></span>
                Status
              </th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="layout__footer" role="contentinfo">
    <small>ReconX TDI 2026 · static dashboard (Day 7)</small>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/trades.js"></script>
</body>
</html>
